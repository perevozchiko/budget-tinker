name: Release

# GITHUB_TOKEN pushes do not trigger workflows, so call the Rust workflow directly.
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version: Current, Patch, Minor or Major"
        type: choice
        required: true
        default: current
        options:
          - current
          - patch
          - minor
          - major
      stage:
        description: "Release stage"
        type: choice
        required: true
        default: alpha
        options:
          - alpha
          - beta
          - rc
          - stable

permissions:
  contents: read

concurrency:
  group: budgettinker-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Calculate and commit next version
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Ensure current master and fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/master)" || {
            echo "::error::master advanced; restart the Release workflow"; exit 1;
          }
      - name: Calculate next release version
        id: plan
        shell: bash
        env:
          BUMP: ${{ inputs.version_bump }}
          STAGE: ${{ inputs.stage }}
        run: python3 scripts/next-release-version.py "$BUMP" "$STAGE"
      - name: Commit version on master (do not create a tag yet)
        id: commit
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/bump-version.py "$VERSION"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore(release): v$VERSION"
            git push origin HEAD:refs/heads/master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Validate and build release
    needs: prepare
    uses: ./.github/workflows/rust.yml
    permissions:
      contents: read
    with:
      platform: all
      release_ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish GitHub Release
    needs: [prepare, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Verify release commit and version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master --tags
          git merge-base --is-ancestor HEAD refs/remotes/origin/master || {
            echo "::error::Release commit is no longer in master"; exit 1;
          }
          python3 scripts/release-version.py
      - name: Download completed release archives
        uses: actions/download-artifact@v8
        with:
          pattern: BudgetTinker-*
          path: release-assets
          merge-multiple: true
      - name: Create tag and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(
            "release-assets/BudgetTinker-${RELEASE_VERSION}-macos-arm64.zip"
            "release-assets/BudgetTinker-${RELEASE_VERSION}-windows-x64.zip"
            "release-assets/BudgetTinker-${RELEASE_VERSION}-linux-x64.tar.gz"
          )
          for archive in "${assets[@]}"; do
            test -s "$archive" || { echo "::error::Missing release archive: $archive"; exit 1; }
          done
          count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = 3 || { echo "::error::Expected three archives, found $count"; exit 1; }
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Release already exists: $RELEASE_TAG"; exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || {
              echo "::error::Existing tag points to a different commit"; exit 1;
            }
          else
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          options=()
          if [[ "$IS_PRERELEASE" == true ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --title "BudgetTinker $RELEASE_TAG" \
            --generate-notes "${options[@]}"
