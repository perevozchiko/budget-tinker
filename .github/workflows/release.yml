name: Release

# GITHUB_TOKEN pushes do not trigger workflows, so call the Rust workflow directly.
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version: Current, Patch, Minor or Major"
        type: choice
        required: true
        default: current
        options:
          - current
          - patch
          - minor
          - major
      stage:
        description: "Release stage"
        type: choice
        required: true
        default: alpha
        options:
          - alpha
          - beta
          - rc
          - stable

permissions:
  contents: read

concurrency:
  group: budgettinker-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Calculate and commit next version
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Ensure current master and fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/master)" || {
            echo "::error::master advanced; restart the Release workflow"; exit 1;
          }
      - name: Calculate next release version
        id: plan
        shell: bash
        env:
          BUMP: ${{ inputs.version_bump }}
          STAGE: ${{ inputs.stage }}
        run: python3 scripts/next-release-version.py "$BUMP" "$STAGE"
      - name: Commit version on master (do not create a tag yet)
        id: commit
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/bump-version.py "$VERSION"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore(release): v$VERSION"
            git push origin HEAD:refs/heads/master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: prepare
    name: Rust checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting, tests, Clippy and examples
        shell: bash
        run: |
          set +e
          cargo fmt --all --check
          format_status=$?
          cargo test --locked --quiet
          test_status=$?
          cargo clippy --all-targets --locked -- -D warnings
          clippy_status=$?
          cargo check --examples --locked
          examples_status=$?
          echo "Formatting: $format_status, tests: $test_status, Clippy: $clippy_status, examples: $examples_status"
          if (( format_status || test_status || clippy_status || examples_status )); then
            exit 1
          fi

      # cargo-deny 0.20.2 uses this stable cache directory for the official DB URL.
      # Fetch via GitHub Actions so cargo-deny's git CLI does not need to refetch main.
      - name: Check out fresh official RustSec advisory database
        uses: actions/checkout@v6
        with:
          repository: RustSec/advisory-db
          ref: main
          path: target/release-audit/advisory-dbs/advisory-db-3157b0e258782691
          fetch-depth: 1
          persist-credentials: false
      - name: Verify RustSec advisory checkout
        shell: bash
        run: |
          set -euo pipefail
          db="target/release-audit/advisory-dbs/advisory-db-3157b0e258782691"
          test -d "$db/crates"
          test -f "$db/README.md"
          git -C "$db" rev-parse --verify HEAD
          git -C "$db" show -s --format='RustSec database: %H (%cI)' HEAD
      - name: Dependency licenses and advisory audit
        shell: bash
        run: |
          cargo install cargo-deny --version 0.20.2 --locked --root "$PWD/target/audit-tools" --target-dir "$PWD/target/audit-tools-build"
          python3 scripts/test-release-tools.py
          # The official DB was checked out fresh in this same CI run.
          # --offline prevents the failing cargo-deny internal git fetch;
          # cargo-deny still enforces the database-staleness limit and advisories.
          python3 scripts/audit-dependencies.py --offline
      - name: Upload dependency audit diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: BudgetTinker-dependency-audit-diagnostics
          path: |
            target/release-audit/deny-*.log
            target/release-audit/dependency-results.json
          if-no-files-found: warn

  build:
    needs: prepare
    name: Build macOS application
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Versioned package name
        id: package
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          python3 scripts/ci-artifact-name.py macos-arm64
      - name: Build app bundle
        run: bash scripts/bundle.sh
      - name: Verify macOS app bundle
        shell: bash
        run: |
          test -s dist/BudgetTinker.app/Contents/MacOS/budgettinker
          test -s dist/BudgetTinker.app/Contents/Resources/BudgetTinker.icns
          plutil -lint dist/BudgetTinker.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/BudgetTinker.app
          file dist/BudgetTinker.app/Contents/MacOS/budgettinker
      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/BudgetTinker.app "${{ steps.package.outputs.stem }}.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.stem }}
          path: ${{ steps.package.outputs.stem }}.zip
          if-no-files-found: error

  linux:
    needs: prepare
    name: Linux x86_64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Versioned package name
        id: package
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          python3 scripts/ci-artifact-name.py linux-x64
      - name: Build Linux executable
        run: cargo build --release --locked
      - name: Verify and package Linux executable
        shell: bash
        run: |
          set -euo pipefail
          test -s target/release/budgettinker
          file target/release/budgettinker
          ldd target/release/budgettinker
          if ldd target/release/budgettinker | grep -q 'not found'; then
            echo "::error::Linux binary has missing runtime libraries"
            exit 1
          fi
          python3 scripts/stage-notices.py target/package/Notices
          tar -czf "${{ steps.package.outputs.stem }}.tar.gz" -C target/release budgettinker -C "$PWD/target/package" Notices
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.stem }}
          path: ${{ steps.package.outputs.stem }}.tar.gz
          if-no-files-found: error

  windows:
    needs: prepare
    name: Windows x86_64 release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Versioned package name
        id: package
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") { throw "Expected an x64 Windows runner" }
          python scripts/ci-artifact-name.py windows-x64
          if ($LASTEXITCODE -ne 0) { throw "Artifact name generation failed" }
      - name: Build Windows executable
        run: cargo build --release --locked
      - name: Verify and package Windows executable
        shell: pwsh
        run: |
          $bin = "target/release/budgettinker.exe"
          if (!(Test-Path $bin) -or (Get-Item $bin).Length -eq 0) {
            throw "Missing or empty Windows release binary"
          }
          $header = [System.IO.File]::ReadAllBytes((Resolve-Path $bin).Path)
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            throw "Expected a Windows PE executable"
          }
          python scripts/stage-notices.py target/package/Notices
          if ($LASTEXITCODE -ne 0) { throw "Notice staging failed" }
          Compress-Archive -Path $bin, "target/package/Notices" -DestinationPath "${{ steps.package.outputs.stem }}.zip" -Force
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.stem }}
          path: ${{ steps.package.outputs.stem }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, validate, build, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Verify release commit and version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master --tags
          git merge-base --is-ancestor HEAD refs/remotes/origin/master || {
            echo "::error::Release commit is no longer in master"; exit 1;
          }
          python3 scripts/release-version.py
      - name: Download completed release archives
        uses: actions/download-artifact@v8
        with:
          pattern: BudgetTinker-*
          path: release-assets
          merge-multiple: true
      - name: Create tag and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(
            "release-assets/BudgetTinker-${RELEASE_VERSION}-macos-arm64.zip"
            "release-assets/BudgetTinker-${RELEASE_VERSION}-windows-x64.zip"
            "release-assets/BudgetTinker-${RELEASE_VERSION}-linux-x64.tar.gz"
          )
          for archive in "${assets[@]}"; do
            test -s "$archive" || { echo "::error::Missing release archive: $archive"; exit 1; }
          done
          count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = 3 || { echo "::error::Expected three archives, found $count"; exit 1; }
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Release already exists: $RELEASE_TAG"; exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || {
              echo "::error::Existing tag points to a different commit"; exit 1;
            }
          else
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          options=()
          if [[ "$IS_PRERELEASE" == true ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --title "BudgetTinker $RELEASE_TAG" \
            --generate-notes "${options[@]}"
